<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match3 Sprite Solver</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    input, select, button {
      border-radius: 8px;
      border: 1px solid #475569;
      padding: 10px 12px;
      background: #0b1120;
      color: white;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      cursor: pointer;
      font-weight: 600;
    }
    canvas {
      display: block;
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    pre {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      overflow: auto;
      max-height: 420px;
      font-size: 12px;
    }
    .meta {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      line-height: 1.6;
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 16px;
    }
    .asset-preview {
      width: 120px;
      height: 120px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #020617;
      margin-top: 8px;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <label>Board screenshot: <input type="file" id="boardInput" accept="image/*" /></label>
        <label>Goal item:
          <select id="goalSelect">
            <option value="blue-jet">Blue Jet</option>
            <option value="yellow-ship">Yellow Ship</option>
            <option value="purple-sub">Purple Sub</option>
            <option value="red-plane">Red Plane</option>
            <option value="green-tank">Green Tank</option>
          </select>
        </label>
        <button id="solveBtn">Solve</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <span id="statusText">Upload a board screenshot and choose a goal item.</span>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <canvas id="boardCanvas" width="900" height="700"></canvas>
      </div>

      <div class="panel">
        <div class="meta">
          <strong>Selected asset</strong><br>
          <img id="assetPreview" class="asset-preview" src="assets/blue-jet.png" alt="goal preview" onerror="this.src='data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA='" />
        </div>
        <div class="meta">
          <strong>Result</strong>
          <pre id="resultBox">{}</pre>
        </div>
      </div>
    </div>
  </div>

  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
  <script>
    const boardCanvas = document.getElementById('boardCanvas');
    const boardCtx = boardCanvas.getContext('2d');
    const goalSelect = document.getElementById('goalSelect');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const assetPreview = document.getElementById('assetPreview');

    let boardImage = null;
    let opencvReady = false;

    const itemMap = {
      'blue-jet': 'assets/blue-jet.png',
      'yellow-ship': 'assets/yellow-ship.png',
      'purple-sub': 'assets/purple-sub.png',
      'red-plane': 'assets/red-plane.png',
      'green-tank': 'assets/green-tank.png'
    };

    function onOpenCvReady() {
      opencvReady = true;
      statusText.textContent = 'OpenCV.js loaded. Upload the board screenshot.';
    }

    goalSelect.addEventListener('change', () => {
      const value = goalSelect.value;
      const src = itemMap[value] || 'data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=';
      assetPreview.src = src;
    });

    document.getElementById('boardInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          boardImage = img;
          boardCanvas.width = img.width;
          boardCanvas.height = img.height;
          boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
          boardCtx.drawImage(img, 0, 0, boardCanvas.width, boardCanvas.height);
          statusText.textContent = 'Board screenshot loaded. Press Solve.';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('solveBtn').addEventListener('click', async () => {
      if (!boardImage) {
        resultBox.textContent = JSON.stringify({ error: 'Upload the board image first.' }, null, 2);
        return;
      }
      if (!opencvReady) {
        resultBox.textContent = JSON.stringify({ error: 'OpenCV.js is still loading.' }, null, 2);
        return;
      }

      const goalKey = goalSelect.value;
      const assetUrl = itemMap[goalKey];
      if (!assetUrl) {
        resultBox.textContent = JSON.stringify({ error: 'Pick a goal item.' }, null, 2);
        return;
      }

      try {
        const boardMat = cv.imread(boardCanvas);
        const targetMat = await loadTemplateMat(assetUrl);
        const matches = detectTemplateMatches(boardMat, targetMat, 0.78);
        const boardMatrix = buildMatrixFromMatches(matches, 8, 8);
        const move = findBestMoveForGoal(boardMatrix, goalKey);

        const output = {
          goal: goalKey,
          asset: assetUrl,
          matchCount: matches.length,
          boardMatrix,
          move: move ? move : null
        };

        resultBox.textContent = JSON.stringify(output, null, 2);
        statusText.textContent = move ? `Move found: from ${move.from.x},${move.from.y} to ${move.to.x},${move.to.y}` : 'No valid move found.';
      } catch (err) {
        resultBox.textContent = JSON.stringify({ error: String(err) }, null, 2);
      }
    });

    function loadTemplateMat(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = img.width;
          tempCanvas.height = img.height;
          const tctx = tempCanvas.getContext('2d');
          tctx.drawImage(img, 0, 0);
          try {
            const mat = cv.imread(tempCanvas);
            resolve(mat);
          } catch (e) {
            reject(e);
          }
        };
        img.onerror = () => reject(new Error('Could not load asset: ' + url));
        img.src = url;
      });
    }

    function detectTemplateMatches(boardMat, templateMat, threshold = 0.78) {
      const result = new cv.Mat();
      cv.matchTemplate(boardMat, templateMat, result, cv.TM_CCOEFF_NORMED);

      const matches = [];
      const cols = result.cols;
      const rows = result.rows;
      const data = result.data32F;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const score = data[y * cols + x];
          if (score >= threshold) {
            matches.push({
              x,
              y,
              w: templateMat.cols,
              h: templateMat.rows,
              score
            });
          }
        }
      }

      matches.sort((a, b) => b.score - a.score);
      boardMat.delete();
      templateMat.delete();
      result.delete();
      return matches;
    }

    function buildMatrixFromMatches(matches, rows, cols) {
      const grid = Array.from({ length: rows }, () => Array(cols).fill(null));
      const boardW = boardCanvas.width;
      const boardH = boardCanvas.height;
      const cellW = boardW / cols;
      const cellH = boardH / rows;

      for (const match of matches) {
        const cx = match.x + match.w / 2;
        const cy = match.y + match.h / 2;
        const cellX = Math.floor(cx / cellW);
        const cellY = Math.floor(cy / cellH);
        if (cellX >= 0 && cellX < cols && cellY >= 0 && cellY < rows) {
          grid[cellY][cellX] = 'goal';
        }
      }

      return grid;
    }

    function cloneGrid(grid) {
      return grid.map(row => row.slice());
    }

    function swapCells(grid, a, b) {
      const temp = grid[a.y][a.x];
      grid[a.y][a.x] = grid[b.y][b.x];
      grid[b.y][b.x] = temp;
    }

    function countGoalRuns(grid, goalKey) {
      let runs = 0;
      const rows = grid.length;
      const cols = grid[0].length;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x <= cols - 3; x++) {
          if (grid[y][x] === goalKey && grid[y][x + 1] === goalKey && grid[y][x + 2] === goalKey) runs++;
        }
      }
      for (let x = 0; x < cols; x++) {
        for (let y = 0; y <= rows - 3; y++) {
          if (grid[y][x] === goalKey && grid[y + 1][x] === goalKey && grid[y + 2][x] === goalKey) runs++;
        }
      }
      return runs;
    }

    function findBestMoveForGoal(grid, goalKey) {
      const rows = grid.length;
      const cols = grid[0].length;
      let best = null;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const neighbors = [];
          if (x + 1 < cols) neighbors.push({ x: x + 1, y });
          if (y + 1 < rows) neighbors.push({ x, y: y + 1 });

          for (const n of neighbors) {
            const test = cloneGrid(grid);
            swapCells(test, { x, y }, n);
            const score = countGoalRuns(test, goalKey);
            if (score > 0 && (!best || score > best.score)) {
              best = { from: { x, y }, to: n, score };
            }
          }
        }
      }

      return best;
    }
  </script>
</body>
</html>
