<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match3 Cell Classification Viewer</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .wrap {
      max-width: 1400px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="file"], button {
      border-radius: 8px;
      border: 1px solid #475569;
      padding: 10px 12px;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(260px, 0.8fr);
      gap: 16px;
    }
    canvas {
      display: block;
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    pre {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      overflow: auto;
      max-height: 420px;
      font-size: 12px;
    }
    .meta {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      line-height: 1.6;
      font-size: 14px;
    }
    .cell-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(24px, 1fr));
      gap: 4px;
      margin-top: 10px;
    }
    .cell {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 6px;
      text-align: center;
      padding: 8px 4px;
      font-size: 11px;
      min-height: 26px;
      color: white;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <label>Board image: <input type="file" id="boardInput" accept="image/*" /></label>
        <button id="analyzeBtn">Classify Cells</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <span id="statusText">Upload a screenshot of the board.</span>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <canvas id="boardCanvas" width="900" height="700"></canvas>
      </div>

      <div class="panel">
        <div class="meta">
          <strong>Detected cell categories</strong>
          <div id="cellGrid" class="cell-grid"></div>
        </div>
        <div class="meta">
          <strong>Summary</strong>
          <pre id="resultBox">{}</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const boardCanvas = document.getElementById('boardCanvas');
    const boardCtx = boardCanvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const cellGrid = document.getElementById('cellGrid');
    const resultBox = document.getElementById('resultBox');

    let boardImage = null;

    document.getElementById('boardInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          boardImage = img;
          boardCanvas.width = img.width;
          boardCanvas.height = img.height;
          boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
          boardCtx.drawImage(img, 0, 0, boardCanvas.width, boardCanvas.height);
          statusText.textContent = 'Board image loaded. Click Classify Cells.';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('analyzeBtn').addEventListener('click', () => {
      if (!boardImage) {
        statusText.textContent = 'Upload a board image first.';
        return;
      }
      const imageData = boardCtx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
      const rows = 8;
      const cols = 8;
      const grid = buildBoardMatrixFromWholeImage(imageData, rows, cols);
      renderCategoryGrid(grid);
      drawGridOverlay(grid, rows, cols);
      const summary = {
        rows,
        cols,
        grid: grid.map(r => r.map(c => ({ x: c.x, y: c.y, name: c.name, hex: c.hex })))
      };
      resultBox.textContent = JSON.stringify(summary, null, 2);
      statusText.textContent = 'Board cells classified and shown below.';
    });

    function buildBoardMatrixFromWholeImage(imageData, rows, cols) {
      const grid = [];
      const cellW = imageData.width / cols;
      const cellH = imageData.height / rows;
      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          const cx = Math.round((x + 0.5) * cellW);
          const cy = Math.round((y + 0.5) * cellH);
          const sampleSize = Math.max(6, Math.min(cellW, cellH) * 0.32);
          const color = averageColorFromRect(imageData, {
            x: Math.max(0, cx - sampleSize),
            y: Math.max(0, cy - sampleSize),
            w: sampleSize * 2,
            h: sampleSize * 2
          });
          const name = rgbToName(color);
          row.push({
            x,
            y,
            name,
            hex: rgbToHex(color.r, color.g, color.b),
            rgb: color
          });
        }
        grid.push(row);
      }
      return grid;
    }

    function averageColorFromRect(imageData, rect) {
      let r = 0, g = 0, b = 0, count = 0;
      const x0 = Math.max(0, Math.min(Math.floor(rect.x), imageData.width));
      const y0 = Math.max(0, Math.min(Math.floor(rect.y), imageData.height));
      const x1 = Math.max(x0, Math.min(Math.ceil(rect.x + rect.w), imageData.width));
      const y1 = Math.max(y0, Math.min(Math.ceil(rect.y + rect.h), imageData.height));
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const idx = (y * imageData.width + x) * 4;
          r += imageData.data[idx];
          g += imageData.data[idx + 1];
          b += imageData.data[idx + 2];
          count++;
        }
      }
      return { r: r / count, g: g / count, b: b / count };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }

    function rgbToName(rgb) {
      const palette = {
        red: { r: 255, g: 0, b: 0 },
        green: { r: 0, g: 180, b: 0 },
        blue: { r: 0, g: 0, b: 255 },
        yellow: { r: 255, g: 215, b: 0 },
        purple: { r: 128, g: 0, b: 128 },
        orange: { r: 255, g: 140, b: 0 },
        pink: { r: 255, g: 105, b: 180 },
        cyan: { r: 0, g: 255, b: 255 },
        brown: { r: 139, g: 69, b: 19 },
        gray: { r: 160, g: 160, b: 160 }
      };

      let bestName = 'unknown';
      let bestDist = Infinity;
      for (const [name, color] of Object.entries(palette)) {
        const dist = Math.sqrt((rgb.r - color.r) ** 2 + (rgb.g - color.g) ** 2 + (rgb.b - color.b) ** 2);
        if (dist < bestDist) {
          bestDist = dist;
          bestName = name;
        }
      }
      return bestDist > 120 ? 'unknown' : bestName;
    }

    function renderCategoryGrid(grid) {
      cellGrid.innerHTML = '';
      const flat = grid.flat();
      for (const cell of flat) {
        const div = document.createElement('div');
        div.className = 'cell';
        div.title = `${cell.name} / ${cell.hex}`;
        div.textContent = cell.name;
        div.style.background = cell.hex;
        div.style.borderColor = '#000';
        cellGrid.appendChild(div);
      }
    }

    function drawGridOverlay(grid, rows, cols) {
      const image = boardCtx.getImageData(0, 0, boardCanvas.width, boardCanvas.height);
      const tmpCanvas = document.createElement('canvas');
      tmpCanvas.width = boardCanvas.width;
      tmpCanvas.height = boardCanvas.height;
      const tmpCtx = tmpCanvas.getContext('2d');
      tmpCtx.putImageData(image, 0, 0);

      const cellW = boardCanvas.width / cols;
      const cellH = boardCanvas.height / rows;
      tmpCtx.strokeStyle = 'rgba(255,255,255,0.55)';
      tmpCtx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        tmpCtx.beginPath();
        tmpCtx.moveTo(i * cellW, 0);
        tmpCtx.lineTo(i * cellW, boardCanvas.height);
        tmpCtx.stroke();
      }
      for (let i = 0; i <= rows; i++) {
        tmpCtx.beginPath();
        tmpCtx.moveTo(0, i * cellH);
        tmpCtx.lineTo(boardCanvas.width, i * cellH);
        tmpCtx.stroke();
      }

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const cell = grid[y][x];
          const drawX = x * cellW + 3;
          const drawY = y * cellH + 3;
          tmpCtx.fillStyle = 'rgba(0,0,0,0.45)';
          tmpCtx.fillRect(drawX, drawY, 48, 18);
          tmpCtx.fillStyle = '#ffffff';
          tmpCtx.font = '12px Arial';
          tmpCtx.fillText(cell.name, drawX + 4, drawY + 13);
        }
      }

      boardCtx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
      boardCtx.drawImage(tmpCanvas, 0, 0);
    }
  </script>
</body>
</html>
