<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match3 Board only + Manual Goal</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
    }
    .wrap { max-width: 1200px; margin: 24px auto; padding: 16px; }
    .panel {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    input[type="file"], input[type="text"], button {
      border-radius: 8px;
      border: 1px solid #475569;
      padding: 10px 12px;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #374151; }
    canvas {
      display: block;
      width: 100%;
      max-width: 1200px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    pre {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      overflow: auto;
      max-height: 300px;
      font-size: 12px;
    }
    .meta {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      line-height: 1.6;
    }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <input type="file" id="fileInput" accept="image/*" />
        <button id="loadBtn">Load Image</button>
        <button id="targetCropBtn" class="secondary">Select Goal Crop</button>
        <button id="analyzeBtn">Analyze</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <label>Manual target hex: <input id="targetHex" type="text" value="#ff0000" placeholder="#ff0000" /></label>
        <button id="useManualHexBtn" class="secondary">Use Manual Target</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <span id="statusText">Upload a board image first.</span>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <canvas id="canvas" width="900" height="700"></canvas>
      </div>

      <div class="panel">
        <div class="meta">
          <strong>How it works</strong><br>
          - Use the entire uploaded image as the board.<br>
          - Crop the target item manually and the script will use that color as the goal.<br>
          - Or paste a target hex like #ff0000 if you know it.
        </div>
        <div class="meta">
          <strong>Goal crop</strong><br>
          <span id="goalCropInfo">not set</span>
        </div>
        <div class="meta">
          <strong>Result</strong>
          <pre id="resultBox">{}</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const goalCropInfo = document.getElementById('goalCropInfo');
    const resultBox = document.getElementById('resultBox');
    const targetHexInput = document.getElementById('targetHex');

    let img = null;
    let cropMode = 'goal';
    let dragStart = null;
    let draftRect = null;
    let goalCropRect = null;
    let manualTargetHex = null;

    document.getElementById('loadBtn').addEventListener('click', () => {
      if (!fileInput.files || !fileInput.files[0]) {
        statusText.textContent = 'Choose an image first.';
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const imgObj = new Image();
        imgObj.onload = () => {
          img = imgObj;
          canvas.width = img.width;
          canvas.height = img.height;
          goalCropRect = null;
          manualTargetHex = null;
          drawImage();
          statusText.textContent = 'Image loaded. Use the full image as board, or crop the goal item.';
        };
        imgObj.src = e.target.result;
      };
      reader.readAsDataURL(fileInput.files[0]);
    });

    document.getElementById('targetCropBtn').addEventListener('click', () => {
      if (!img) {
        statusText.textContent = 'Load an image first.';
        return;
      }
      cropMode = 'goal';
      statusText.textContent = 'Select a crop of the goal item on the image.';
    });

    document.getElementById('useManualHexBtn').addEventListener('click', () => {
      const v = targetHexInput.value.trim();
      if (!v) {
        statusText.textContent = 'Enter a valid hex color like #ff0000';
        return;
      }
      manualTargetHex = hexToRgb(v);
      statusText.textContent = 'Manual target set. Click Analyze.';
      drawImage();
    });

    document.getElementById('analyzeBtn').addEventListener('click', () => {
      if (!img) {
        statusText.textContent = 'Load an image first.';
        return;
      }

      let targetColor = null;
      if (manualTargetHex) {
        targetColor = manualTargetHex;
      } else if (goalCropRect) {
        const src = getCanvasImageData();
        targetColor = averageColorFromRect(src, goalCropRect);
      } else {
        statusText.textContent = 'Select a goal crop or provide a manual target hex.';
        return;
      }

      const boardData = buildBoardMatrixFromWholeImage(getCanvasImageData(), 8, 8);
      const move = findBestMoveForColor(boardData, rgbToName(targetColor));

      const result = {
        board: { rows: 8, cols: 8 },
        goalColor: targetColor,
        goalHex: rgbToHex(targetColor.r, targetColor.g, targetColor.b),
        from: move ? move.from : null,
        to: move ? move.to : null,
        score: move ? move.score : 0,
        boardMatrix: boardData
      };

      resultBox.textContent = JSON.stringify(result, null, 2);
      statusText.textContent = move
        ? `Move found: from ${move.from.x},${move.from.y} to ${move.to.x},${move.to.y}`
        : 'No valid move found for this goal.';
    });

    function drawImage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!img) return;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      if (goalCropRect) drawRect(goalCropRect, 'rgba(245,158,11,0.9)', 'Goal Crop');
      if (draftRect) drawRect(draftRect, 'rgba(59,130,246,0.9)', 'Draft');
    }

    function drawRect(rect, strokeStyle, label) {
      ctx.save();
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 5]);
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.setLineDash([]);
      ctx.fillStyle = strokeStyle;
      ctx.fillRect(rect.x, rect.y - 18, 80, 18);
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Arial';
      ctx.fillText(label, rect.x + 6, rect.y - 4);
      ctx.restore();
    }

    function toCanvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', (evt) => {
      if (!img) return;
      const p = toCanvasPoint(evt);
      dragStart = p;
      draftRect = { x: p.x, y: p.y, w: 0, h: 0 };
      drawImage();
    });

    canvas.addEventListener('mousemove', (evt) => {
      if (!dragStart) return;
      const p = toCanvasPoint(evt);
      draftRect = {
        x: Math.min(dragStart.x, p.x),
        y: Math.min(dragStart.y, p.y),
        w: Math.abs(p.x - dragStart.x),
        h: Math.abs(p.y - dragStart.y)
      };
      drawImage();
    });

    canvas.addEventListener('mouseup', () => {
      if (!dragStart || !draftRect) return;
      const rect = normalizeRect(draftRect);
      if (cropMode === 'goal') {
        goalCropRect = rect;
        goalCropInfo.textContent = `${Math.round(rect.x)}, ${Math.round(rect.y)}, ${Math.round(rect.w)}x${Math.round(rect.h)}`;
      }
      dragStart = null;
      draftRect = null;
      drawImage();
    });

    function normalizeRect(r) {
      return {
        x: Math.max(0, Math.min(r.x, canvas.width)),
        y: Math.max(0, Math.min(r.y, canvas.height)),
        w: Math.max(1, Math.min(r.w, canvas.width - Math.min(r.x, canvas.width))),
        h: Math.max(1, Math.min(r.h, canvas.height - Math.min(r.y, canvas.height)))
      };
    }

    function getCanvasImageData() {
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width;
      tmp.height = canvas.height;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0);
      return tctx.getImageData(0, 0, tmp.width, tmp.height);
    }

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const num = Number.parseInt(full, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }

    function averageColorFromRect(imageData, rect) {
      let r = 0, g = 0, b = 0, count = 0;
      const x0 = Math.max(0, Math.min(Math.floor(rect.x), imageData.width));
      const y0 = Math.max(0, Math.min(Math.floor(rect.y), imageData.height));
      const x1 = Math.max(x0, Math.min(Math.ceil(rect.x + rect.w), imageData.width));
      const y1 = Math.max(y0, Math.min(Math.ceil(rect.y + rect.h), imageData.height));
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const idx = (y * imageData.width + x) * 4;
          r += imageData.data[idx];
          g += imageData.data[idx + 1];
          b += imageData.data[idx + 2];
          count++; 
        }
      }
      return {
        r: r / count,
        g: g / count,
        b: b / count
      };
    }

    function rgbToName(rgb) {
      const palette = {
        red: { r: 255, g: 0, b: 0 },
        green: { r: 0, g: 180, b: 0 },
        blue: { r: 0, g: 0, b: 255 },
        yellow: { r: 255, g: 215, b: 0 },
        purple: { r: 128, g: 0, b: 128 },
        orange: { r: 255, g: 140, b: 0 },
        pink: { r: 255, g: 105, b: 180 },
        cyan: { r: 0, g: 255, b: 255 },
        brown: { r: 139, g: 69, b: 19 },
        gray: { r: 160, g: 160, b: 160 }
      };

      let bestName = 'unknown';
      let bestDist = Infinity;
      for (const [name, color] of Object.entries(palette)) {
        const dist = Math.sqrt((rgb.r - color.r) ** 2 + (rgb.g - color.g) ** 2 + (rgb.b - color.b) ** 2);
        if (dist < bestDist) {
          bestDist = dist;
          bestName = name;
        }
      }
      return bestDist > 120 ? 'unknown' : bestName;
    }

    function cloneBoard(board) {
      return board.map(row => row.map(cell => ({ ...cell, name: cell.name })));
    }

    function swap(board, a, b) {
      const temp = board[a.y][a.x].name;
      board[a.y][a.x].name = board[b.y][b.x].name;
      board[b.y][b.x].name = temp;
    }

    function countGoalRuns(board, goalName) {
      let runs = 0;
      const rows = board.length;
      const cols = board[0].length;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x <= cols - 3; x++) {
          if (board[y][x].name === goalName && board[y][x + 1].name === goalName && board[y][x + 2].name === goalName) runs++;
        }
      }
      for (let x = 0; x < cols; x++) {
        for (let y = 0; y <= rows - 3; y++) {
          if (board[y][x].name === goalName && board[y + 1][x].name === goalName && board[y + 2][x].name === goalName) runs++;
        }
      }
      return runs;
    }

    function buildBoardMatrixFromWholeImage(imageData, rows, cols) {
      const grid = [];
      const cellW = imageData.width / cols;
      const cellH = imageData.height / rows;
      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          const cx = Math.round((x + 0.5) * cellW);
          const cy = Math.round((y + 0.5) * cellH);
          const sampleSize = 6;
          const color = averageColorFromRect(imageData, {
            x: Math.max(0, cx - sampleSize),
            y: Math.max(0, cy - sampleSize),
            w: sampleSize * 2,
            h: sampleSize * 2
          });
          const name = rgbToName(color);
          row.push({ x, y, name, hex: rgbToHex(color.r, color.g, color.b), rgb: color });
        }
        grid.push(row);
      }
      return grid;
    }

    function findBestMoveForColor(boardGrid, goalName) {
      if (!goalName || goalName === 'unknown') return null;
      const board = cloneBoard(boardGrid);
      let best = null;
      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board[0].length; x++) {
          const neighbors = [];
          if (x + 1 < board[0].length) neighbors.push({ x: x + 1, y });
          if (y + 1 < board.length) neighbors.push({ x, y: y + 1 });
          for (const n of neighbors) {
            const test = cloneBoard(board);
            swap(test, { x, y }, n);
            const score = countGoalRuns(test, goalName);
            if (score > 0 && (!best || score > best.score)) {
              best = { from: { x, y }, to: n, score };
            }
          }
        }
      }
      return best;
    }
  </script>
</body>
</html>
