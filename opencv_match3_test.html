<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match3 Auto Analyzer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    input[type="file"], button {
      border-radius: 8px;
      border: 1px solid #475569;
      padding: 10px 12px;
      font-size: 14px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      max-width: 980px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
    }
    pre {
      margin: 0;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      overflow: auto;
      max-height: 300px;
      font-size: 12px;
    }
    .meta {
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      line-height: 1.6;
      font-size: 14px;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
      gap: 16px;
    }
    .status {
      color: #cbd5e1;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <input type="file" id="fileInput" accept="image/*" />
        <button id="loadBtn">Analyze Image</button>
      </div>
      <div class="row" style="margin-top: 12px;">
        <span class="status" id="statusText">Waiting for image...</span>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <canvas id="canvas" width="900" height="700"></canvas>
      </div>

      <div class="sidebar">
        <div class="meta">
          <strong>Auto ROIs</strong><br>
          Board: x=55..1025, y=859..1835<br>
          Goal: x=571..834, y=198..470
        </div>

        <div class="meta">
          <strong>Board ROI</strong><br>
          <span id="boardInfo">not set</span>
        </div>

        <div class="meta">
          <strong>Goal ROI</strong><br>
          <span id="goalInfo">not set</span>
        </div>

        <div class="meta">
          <strong>Result</strong>
          <pre id="resultBox">{}</pre>
        </div>
      </div>
    </div>
  </div>

  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const boardInfo = document.getElementById('boardInfo');
    const goalInfo = document.getElementById('goalInfo');
    const resultBox = document.getElementById('resultBox');

    let img = null;
    let opencvReady = false;

    const DEFAULT_BOARD = { x: 55, y: 859, w: 970, h: 976 };
    const DEFAULT_GOAL = { x: 571, y: 198, w: 263, h: 272 };

    function onOpenCvReady() {
      opencvReady = true;
      statusText.textContent = 'OpenCV loaded. Upload any image.';
    }

    document.getElementById('loadBtn').addEventListener('click', () => {
      if (!fileInput.files || !fileInput.files[0]) {
        statusText.textContent = 'Choose an image first.';
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        const imgObj = new Image();
        imgObj.onload = () => {
          img = imgObj;
          canvas.width = img.width;
          canvas.height = img.height;
          drawImage();
          analyzeImage();
        };
        imgObj.src = e.target.result;
      };
      reader.readAsDataURL(fileInput.files[0]);
    });

    function drawImage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!img) return;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      drawRect(DEFAULT_BOARD, 'rgba(34,197,94,0.9)', 'Board');
      drawRect(DEFAULT_GOAL, 'rgba(245,158,11,0.9)', 'Goal');
    }

    function drawRect(rect, strokeStyle, label) {
      ctx.save();
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 5]);
      ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
      ctx.setLineDash([]);
      ctx.fillStyle = strokeStyle;
      ctx.fillRect(rect.x, rect.y - 18, 80, 18);
      ctx.fillStyle = '#ffffff';
      ctx.font = '12px Arial';
      ctx.fillText(label, rect.x + 6, rect.y - 4);
      ctx.restore();
    }

    function analyzeImage() {
      if (!img) {
        statusText.textContent = 'No image loaded.';
        return;
      }

      if (!opencvReady) {
        statusText.textContent = 'OpenCV not ready yet.';
        return;
      }

      const rows = 8;
      const cols = 8;
      const src = getImageDataFromCanvas();

      const boardData = getCellGridData(src, DEFAULT_BOARD, rows, cols);
      const goal = estimateGoalColor(src, DEFAULT_GOAL);
      const move = findBestMoveForGoal(boardData, goal);

      boardInfo.textContent = `${DEFAULT_BOARD.x}, ${DEFAULT_BOARD.y}, ${DEFAULT_BOARD.w}x${DEFAULT_BOARD.h}`;
      goalInfo.textContent = `${DEFAULT_GOAL.x}, ${DEFAULT_GOAL.y}, ${DEFAULT_GOAL.w}x${DEFAULT_GOAL.h}`;

      const result = {
        board: {
          rows,
          cols,
          roi: DEFAULT_BOARD
        },
        goal: {
          name: goal.name,
          rgb: goal.rgb,
          hex: rgbToHex(goal.r, goal.g, goal.b),
          roi: DEFAULT_GOAL
        },
        move: move ? move : null,
        boardMatrix: boardData.map(row => row.map(v => ({
          x: v.x,
          y: v.y,
          name: v.name,
          hex: v.hex
        })))
      };

      resultBox.textContent = JSON.stringify(result, null, 2);

      if (move) {
        statusText.textContent = `Move found: from ${move.from.x},${move.from.y} to ${move.to.x},${move.to.y}`;
      } else {
        statusText.textContent = 'No valid match move found for the detected goal.';
      }
    }

    function getImageDataFromCanvas() {
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width;
      tmp.height = canvas.height;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0);
      return tctx.getImageData(0, 0, tmp.width, tmp.height);
    }

    function averageColorAtRect(imageData, x, y, w, h) {
      let r = 0, g = 0, b = 0, count = 0;
      const maxX = Math.min(imageData.width, x + w);
      const maxY = Math.min(imageData.height, y + h);
      for (let yy = y; yy < maxY; yy++) {
        for (let xx = x; xx < maxX; xx++) {
          const idx = (yy * imageData.width + xx) * 4;
          r += imageData.data[idx];
          g += imageData.data[idx + 1];
          b += imageData.data[idx + 2];
          count++;
        }
      }
      return { r: r / count, g: g / count, b: b / count };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    }

    function colorDistance(a, b) {
      return Math.sqrt((a.r - b.r) ** 2 + (a.g - b.g) ** 2 + (a.b - b.b) ** 2);
    }

    function classifyColor(c) {
      const palette = {
        red: { r: 255, g: 0, b: 0 },
        green: { r: 0, g: 180, b: 0 },
        blue: { r: 0, g: 0, b: 255 },
        yellow: { r: 255, g: 215, b: 0 },
        purple: { r: 128, g: 0, b: 128 },
        orange: { r: 255, g: 140, b: 0 },
        pink: { r: 255, g: 105, b: 180 },
        cyan: { r: 0, g: 255, b: 255 },
        brown: { r: 139, g: 69, b: 19 },
        gray: { r: 160, g: 160, b: 160 }
      };

      let bestName = 'unknown';
      let bestDist = Infinity;
      for (const [name, color] of Object.entries(palette)) {
        const d = colorDistance(c, color);
        if (d < bestDist) {
          bestDist = d;
          bestName = name;
        }
      }
      if (bestDist > 120) bestName = 'unknown';
      return bestName;
    }

    function getCellGridData(imageData, rect, rows, cols) {
      const grid = [];
      const cellW = rect.w / cols;
      const cellH = rect.h / rows;

      for (let y = 0; y < rows; y++) {
        const row = [];
        for (let x = 0; x < cols; x++) {
          const cx = Math.round(rect.x + x * cellW + cellW / 2);
          const cy = Math.round(rect.y + y * cellH + cellH / 2);
          const sampleSize = Math.max(4, Math.min(cellW, cellH) * 0.35);
          const avg = averageColorAtRect(
            imageData,
            Math.max(0, cx - sampleSize / 2),
            Math.max(0, cy - sampleSize / 2),
            Math.max(3, sampleSize),
            Math.max(3, sampleSize)
          );
          const name = classifyColor(avg);
          row.push({
            x,
            y,
            rgb: avg,
            name,
            hex: rgbToHex(avg.r, avg.g, avg.b),
            center: { x: cx, y: cy }
          });
        }
        grid.push(row);
      }
      return grid;
    }

    function estimateGoalColor(imageData, rect) {
      const sampleW = Math.max(4, Math.floor(rect.w * 0.5));
      const sampleH = Math.max(4, Math.floor(rect.h * 0.5));
      const sx = Math.round(rect.x + rect.w * 0.25);
      const sy = Math.round(rect.y + rect.h * 0.25);
      const avg = averageColorAtRect(imageData, sx, sy, sampleW, sampleH);
      const name = classifyColor(avg);
      return {
        r: avg.r,
        g: avg.g,
        b: avg.b,
        name,
        rgb: avg,
        hex: rgbToHex(avg.r, avg.g, avg.b)
      };
    }

    function cloneBoard(board) {
      return board.map(row => row.map(cell => ({ ...cell, name: cell.name })));
    }

    function swap(board, a, b) {
      const temp = board[a.y][a.x].name;
      board[a.y][a.x].name = board[b.y][b.x].name;
      board[b.y][b.x].name = temp;
    }

    function countGoalRuns(board, goalName) {
      let runs = 0;
      const rows = board.length;
      const cols = board[0].length;
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x <= cols - 3; x++) {
          if (
            board[y][x].name === goalName &&
            board[y][x + 1].name === goalName &&
            board[y][x + 2].name === goalName
          ) {
            runs++;
          }
        }
      }
      for (let x = 0; x < cols; x++) {
        for (let y = 0; y <= rows - 3; y++) {
          if (
            board[y][x].name === goalName &&
            board[y + 1][x].name === goalName &&
            board[y + 2][x].name === goalName
          ) {
            runs++;
          }
        }
      }
      return runs;
    }

    function findBestMoveForGoal(boardGrid, goal) {
      const goalName = goal.name || 'unknown';
      if (goalName === 'unknown') return null;

      let best = null;
      const board = cloneBoard(boardGrid);

      for (let y = 0; y < board.length; y++) {
        for (let x = 0; x < board[0].length; x++) {
          const neighbors = [];
          if (x + 1 < board[0].length) neighbors.push({ x: x + 1, y });
          if (y + 1 < board.length) neighbors.push({ x, y: y + 1 });

          for (const n of neighbors) {
            const test = cloneBoard(board);
            swap(test, { x, y }, n);
            const score = countGoalRuns(test, goalName);
            if (score > 0) {
              if (!best || score > best.score) {
                best = {
                  from: { x, y },
                  to: n,
                  score
                };
              }
            }
          }
        }
      }

      return best;
    }
  </script>
</body>
</html>
